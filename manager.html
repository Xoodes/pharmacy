<style>
:root{--bg:#eef4f1;--surface:#fff;--ink:#12261f;--mute:#5d7068;--line:#d5e1db;--brand:#0f6b4f;--brand-ink:#fff;--ok:#0f6b4f;--okbg:#d9efe5;--low:#8a5a00;--lowbg:#fbeac2;--bad:#a42a2a;--badbg:#f8dcdc;--rx:#3b4a9e;--rxbg:#e2e6fa;--glow:#cfe9df;color-scheme:light;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1517;--surface:#141d20;--ink:#ffffff;--mute:#8fb3a6;--line:#2a3a3e;--brand:#4b93b8;--brand-ink:#08221a;--ok:#5fe3a1;--okbg:#16382b;--low:#f2a65a;--lowbg:#352b17;--bad:#ff7b7b;--badbg:#3d1c1c;--rx:#9db4fa;--rxbg:#242a52;--glow:#12333a;color-scheme:dark}:root:not([data-theme="light"]) .av{color:hsl(var(--h) 75% 74%)}}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;min-height:100vh;background:var(--bg) radial-gradient(900px 520px at 12% -8%,var(--glow),transparent 62%) fixed;color:var(--ink);font:400 15px/1.5 Figtree,system-ui,sans-serif}
h1,h2,.brand,.num,.price{font-family:"Bricolage Grotesque",Figtree,system-ui,sans-serif}
button,input,select{font:inherit;color:inherit}:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.ic{width:20px;height:20px;flex:none}.splash{display:grid;place-items:center;min-height:70vh;color:var(--mute)}
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow:auto;padding:22px 14px;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;letter-spacing:-.02em;margin:0 8px 14px}
.brand i{width:30px;height:30px;border-radius:9px;background:var(--brand);display:grid;place-items:center;flex:none}
.brand i:after{content:"";width:12px;height:12px;background:linear-gradient(var(--brand-ink),var(--brand-ink)) center/100% 4px no-repeat,linear-gradient(var(--brand-ink),var(--brand-ink)) center/4px 100% no-repeat}
.nl{font-size:11px;letter-spacing:.09em;color:var(--mute);margin:16px 10px 6px;font-weight:600;text-transform:uppercase}
.nv{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;color:var(--ink);text-decoration:none;font-weight:500;transition:background .15s}
.nv:hover{background:var(--bg)}.nv[aria-current=page]{background:var(--brand);color:var(--brand-ink)}
.col{min-width:0;padding:0 26px 70px}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:14px 0;padding-top:max(14px,env(safe-area-inset-top));background:linear-gradient(var(--bg) 72%,transparent)}
.sbox{flex:1 1 0;min-width:0;max-width:460px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0 12px;min-height:44px;color:var(--mute)}
.sbox input{flex:1;min-width:0;border:0;background:none;outline:none;color:var(--ink);padding:10px 0}
.top .sp{flex:1}
.icb{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;position:relative;flex:none}
.icb:hover{border-color:var(--brand)}.icb.sm{width:34px;height:34px;border-radius:10px}.icb.dg:hover{border-color:var(--bad);color:var(--bad)}
.icb b{position:absolute;top:-6px;right:-6px;min-width:19px;height:19px;border-radius:10px;background:var(--bad);color:var(--bg);font-size:11px;display:grid;place-items:center;padding:0 5px}
.menu{display:none}
.who{position:relative}
.chip{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:5px 10px 5px 6px;cursor:pointer}
.av2{width:34px;height:34px;border-radius:50%;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-weight:700;text-transform:uppercase}
.wt{text-align:left;line-height:1.2}.wt b{display:block;font-size:13.5px;max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.wt small{color:var(--mute);font-size:12px}
.pop{position:absolute;right:0;top:calc(100% + 8px);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px;min-width:200px;box-shadow:0 14px 34px rgba(0,0,0,.2)}
.pop a,.pop button{display:block;width:100%;text-align:left;padding:10px 12px;border:0;background:none;border-radius:10px;cursor:pointer;text-decoration:none;color:var(--ink)}
.pop a:hover,.pop button:hover{background:var(--bg)}
.ph{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:6px 0 18px;flex-wrap:wrap}
h1{font-size:clamp(26px,4vw,36px);line-height:1.1;margin:0;letter-spacing:-.03em;font-weight:800}
.sub{color:var(--mute);margin:4px 0 0}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--brand);color:var(--brand-ink);border:0;border-radius:12px;padding:10px 18px;font-weight:600;cursor:pointer;min-height:42px;text-decoration:none}
.btn:active{transform:scale(.97)}.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}.btn.danger{background:var(--badbg);color:var(--bad)}.btn.sm{min-height:36px;padding:6px 14px}

<script>
const SB="https://kscnfjumpwtnuvvosqfe.supabase.co";
const KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtzY25manVtcHd0bnV2dm9zcWZlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMxMjAyNTYsImV4cCI6MjEwODY5NjI1Nn0.j50ox8QAqz4OB1Lm9YNQaqZK_AY3Hw2T9tDAGrEKCvw";
const SKEY="shelf-session-v1", day=86400000, now=Date.now();
const PHARMACY={name:"Mekonen Pharmacy"};
let session=null;try{session=JSON.parse(localStorage.getItem(SKEY))}catch(e){}
function saveSess(s){session=s;try{s?localStorage.setItem(SKEY,JSON.stringify(s)):localStorage.removeItem(SKEY)}catch(e){}}
async function tokenCall(grant,body){
 const r=await fetch(SB+"/auth/v1/token?grant_type="+grant,{method:"POST",headers:{apikey:KEY,"Content-Type":"application/json"},body:JSON.stringify(body)});
 const d=await r.json().catch(()=>({}));
 if(!r.ok)throw new Error(d.error_description||d.msg||"Sign in failed");
 return {access_token:d.access_token,refresh_token:d.refresh_token,expires_at:d.expires_at||Math.floor(Date.now()/1000)+d.expires_in,email:(d.user&&d.user.email)||(session&&session.email)||""}}
const login=async(email,password)=>{saveSess(await tokenCall("password",{email,password}));api("/rest/v1/rpc/mark_accepted",{method:"POST",body:{}}).catch(()=>{})};
async function api(path,o={}){
 let token=KEY;
 if(o.auth!==false&&session){
  if(session.expires_at-Date.now()/1000<60){try{saveSess(await tokenCall("refresh_token",{refresh_token:session.refresh_token}))}catch(e){saveSess(null);const x=new Error("Session ended. Please sign in again.");x.status=401;throw x}}
  token=session.access_token}
 const h={apikey:KEY,Authorization:"Bearer "+token,"Content-Type":"application/json"};if(o.prefer)h.Prefer=o.prefer;
 const r=await fetch(SB+path,{method:o.method||"GET",headers:h,body:o.body?JSON.stringify(o.body):undefined});
 if(!r.ok){let m="Request failed ("+r.status+")";try{m=(await r.json()).message||m}catch(e){}const x=new Error(m);x.status=r.status;throw x}
 return r.status===204?null:r.json()}
function uid(){try{const p=session.access_token.split(".")[1].replace(/-/g,"+").replace(/_/g,"/");return JSON.parse(atob(p)).sub}catch(e){return""}}
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=n=>"Br "+Number(n).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const big=n=>Math.round(n).toLocaleString("en-US");
const safe=x=>typeof x==="string"&&/^[=+\-@]/.test(x)?"'"+x:String(x==null?"":x);
const daysLeft=d=>Math.round((new Date(d)-now)/day);
const hue=s=>{let h=0;for(const c of String(s||"x"))h=(h*31+c.charCodeAt(0))%360;return h};
function status(i){const d=daysLeft(i.expiry);
 if(d<0)return{k:"bad",t:"Expired"};if(i.qty===0)return{k:"bad",t:"Out of stock"};
 if(i.qty<=i.reorder)return{k:"low",t:"Reorder"};if(d<=90)return{k:"low",t:"Expires in "+d+"d"};return{k:"ok",t:"In stock"}}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove("on"),2400)}
const P={grid:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
box:'<path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/>',list:'<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/>',
clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',bars:'<path d="M5 20V10M12 20V4M19 20v-7"/>',
users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 3-6 6.5-6s6.5 2.4 6.5 6"/><circle cx="17.5" cy="9" r="2.5"/><path d="M17 14c2.8 0 4.5 1.8 4.5 4.5"/>',
gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9L7 7M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/>',
bell:'<path d="M6 9a6 6 0 0112 0c0 6 2 7 2 7H4s2-1 2-7"/><path d="M10 20a2 2 0 004 0"/>',search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>',
menu:'<path d="M4 7h16M4 12h16M4 17h16"/>',edit:'<path d="M4 20h4l10-10-4-4L4 16v4z"/>',trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',plus:'<path d="M12 5v14M5 12h14"/>',chev:'<path d="M6 9l6 6 6-6"/>'};
const ic=n=>`<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[n]}</svg>`;

let items=[],hist=[],histErr=null,histOk=false,people=[],cfg=null,me=null,lerr="",ready=false,plan={};
const ROUTES=["dashboard","products","reorder","history","reports","staff","settings"];
let route="dashboard";
const pf={q:"",cat:"All",st:"all",sort:"name",page:1,size:10,sel:new Set()};
const NAV=[["Main",[["dashboard","Dashboard","grid"],["products","Products","box"]]],["Stock",[["reorder","Reorder list","list"],["history","History","clock"],["reports","Reports","bars"]]],["Admin",[["staff","Staff access","users"],["settings","Settings","gear"]]]];
const lowItems=()=>items.filter(i=>i.qty<=i.reorder&&daysLeft(i.expiry)>=0).sort((a,b)=>(a.qty/(a.reorder||1))-(b.qty/(b.reorder||1))||a.name.localeCompare(b.name));
const expItems=()=>items.filter(i=>daysLeft(i.expiry)<=90).sort((a,b)=>new Date(a.expiry)-new Date(b.expiry));
const attention=()=>[...new Set([...items.filter(i=>daysLeft(i.expiry)<0),...items.filter(i=>i.qty===0),...lowItems(),...expItems()])];

let alog=[];
const STAFF_URL=location.origin+location.pathname.replace(/[^/]*$/,"")+"staff.html";
async function signOut(msg){await serverLogout();saveSess(null);ready=false;items=[];viewLogin(msg)}
let idle=Date.now();["click","keydown","touchstart"].forEach(ev=>addEventListener(ev,()=>idle=Date.now(),{passive:true}));
setInterval(()=>{if(session&&Date.now()-idle>30*60000)signOut("Signed out after 30 minutes of inactivity.")},30000);
async function serverLogout(){try{if(session)await fetch(SB+"/auth/v1/logout",{method:"POST",headers:{apikey:KEY,Authorization:"Bearer "+session.access_token}})}catch(e){}}
setInterval(async()=>{if(!ready||document.hidden||$("#dlg").open||!["dashboard","products","reorder","staff"].includes(route))return;const a=document.activeElement;if(a&&/INPUT|SELECT|TEXTAREA/.test(a.tagName))return;try{items=await api("/rest/v1/items?select=*&order=name");if(route==="staff")await loadPeople();renderMain()}catch(e){}},60000);
/* ---------- start-up and screens before sign-in ---------- */
function routeFromHash(){const h=location.hash.slice(1);route=ROUTES.includes(h)?h:"dashboard"}
async function loadMe(){try{const r=await api(`/rest/v1/profiles?select=role,active&user_id=eq.${uid()}`);return r[0]||{role:"none",active:false}}catch(e){if(e.status===404)return{setup:true};throw e}}
async function start(){
 routeFromHash();ready=false;
 if(!session)return viewLogin();
 $("#root").innerHTML='<div class="splash">Loading…</div>';
 try{me=await loadMe()}catch(e){if(e.status===401){saveSess(null);return viewLogin(e.message)}return viewMsg("Couldn’t load the data",esc(e.message),true)}
 if(me.setup)return viewMsg("One setup step is missing","The manager setup script has not been run in Supabase yet. Open <b>manager_setup.sql</b>, run it in the SQL Editor, then reload this page.",true);
 if(!me.active||me.role!=="manager")return viewMsg(me.active?"This page is for the manager":"Your access is switched off",me.active?"You are signed in as staff. Staff use the stock room page.":"Ask the manager to switch your access back on.",false,true);
 try{[items,cfg]=await Promise.all([api("/rest/v1/items?select=*&order=name"),api("/rest/v1/settings?select=*&id=eq.1").then(r=>r[0]||null).catch(()=>null)])}
 catch(e){return viewMsg("Couldn’t load the data",esc(e.message),true)}

function viewLogin(m){$("#root").innerHTML=`<form class="login" id="lf"><div class="brand"><i></i><span>${esc(PHARMACY.name)}</span></div><h1>Manager sign in</h1><p class="sub">This page is for the pharmacy manager only.</p>

 if(retry)$("#rt").onclick=start;$("#so2").onclick=()=>signOut()}

function buildShell(){
 const email=(session&&session.email)||"manager";
 $("#root").innerHTML=`<div class="app"><aside class="side" id="side"><div class="brand"><i></i><span>${esc(PHARMACY.name)}</span></div>
 ${NAV.map(([g,l])=>`<div class="nl">${g}</div>`+l.map(([r,t,i])=>`<a class="nv" href="#${r}" data-r="${r}">${ic(i)}<span>${t}</span></a>`).join("")).join("")}</aside>
 <div class="scrim" id="scrim"></div>
 <div class="col"><header class="top"><button class="icb menu" id="menu" aria-label="Open menu">${ic("menu")}</button>
 <label class="sbox">${ic("search")}<input id="gq" type="search" placeholder="Search products" aria-label="Search" autocomplete="off"></label><span class="sp"></span>
 <button class="icb" id="bell" aria-label="Alerts">${ic("bell")}<b id="bn2" hidden></b></button>
 <div class="who"><button class="chip" id="chip" aria-haspopup="true"><span class="av2">${esc(email[0])}</span><span class="wt"><b>${esc(email)}</b><small>Manager</small></span>${ic("chev")}</button>
 <div class="pop" id="pop" hidden><a href="staff.html">Open staff page</a><button id="so">Sign out</button></div></div></header><main id="main"></main></div></div>`;
 $("#menu").onclick=()=>document.body.classList.toggle("nav");$("#scrim").onclick=()=>document.body.classList.remove("nav");
 $("#chip").onclick=e=>{e.stopPropagation();$("#pop").hidden=!$("#pop").hidden};
 document.addEventListener("click",()=>{const p=$("#pop");if(p)p.hidden=true});

 $("#bell").onclick=()=>{location.hash="reorder"};
 $("#gq").oninput=e=>{pf.q=e.target.value;pf.page=1;if(route==="products"||route==="history")renderMain();else location.hash="products"};

 try{if(need)await loadHist();if(needP)await loadPeople()}catch(e){}

/* ---------- data helpers ---------- */
function catStats(){const m={};items.forEach(i=>{const c=i.category||"Other";(m[c]=m[c]||{name:c,n:0,units:0,v:0});m[c].n++;m[c].units+=i.qty;m[c].v+=i.qty*i.price});return Object.values(m).sort((a,b)=>b.v-a.v)}
function outEvents(days){const cut=now-days*day;return hist.filter(h=>h.action==="changed"&&h.old_qty>h.new_qty&&new Date(h.changed_at).getTime()>=cut)}
function movers(days){const m={};outEvents(days).forEach(h=>{m[h.item_name]=(m[h.item_name]||0)+(h.old_qty-h.new_qty)});return Object.entries(m).map(([name,out])=>({name,out})).sort((a,b)=>b.out-a.out)}
function daily(days){const a=Array(days).fill(0);outEvents(days).forEach(h=>{const k=days-1-Math.floor((now-new Date(h.changed_at).getTime())/day);if(k>=0&&k<days)a[k]+=h.old_qty-h.new_qty});return a}
const when=t=>new Date(t).toLocaleString("en-GB",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});
function csv(name,rows){const t=rows.map(r=>r.map(x=>'"'+safe(x).replace(/"/g,'""')+'"').join(",")).join("\n");const a=document.createElement("a");a.href="data:text/csv;charset=utf-8,"+encodeURIComponent("\uFEFF"+t);a.download=name+".csv";a.click()}
const H=["name","generic","category","strength","form","qty","reorder","price","expiry","rx","shelf"];
const itemRows=l=>[H].concat(l.map(i=>H.map(k=>i[k])));
function exportItems(){csv("inventory",itemRows(items));try{localStorage.setItem("mgr-backup",new Date().toISOString())}catch(e){}if(route==="dashboard")renderMain()}
const hintHist=()=>histErr==="setup"?"Turn on the history log (see the setup guide) to see this.":"Nothing yet. This fills in as stock changes are made.";

/* ---------- dashboard ---------- */
function vDash(){
 const low=lowItems(),ex=expItems(),val=items.reduce((a,i)=>a+i.qty*i.price,0),cats=catStats(),mv=movers(30),max=Math.max(1,...cats.map(c=>c.v)),mx=Math.max(1,...mv.map(m=>m.out));
 const at=attention().slice(0,7);
 let last="";try{last=localStorage.getItem("mgr-backup")||""}catch(e){}
 const ago=last?Math.floor((now-new Date(last).getTime())/day):null;
 return `<div class="ph"><div><h1>Dashboard</h1><p class="sub">How the pharmacy’s stock looks right now.</p></div><button class="btn" data-a="add">${ic("plus")} Add product</button></div>
 <div class="stats"><div class="st"><div class="num">${items.length}</div><span>Products</span></div><div class="st"><div class="num">${big(val)}</div><span>Stock value (Br)</span></div>
 <div class="st ${low.length?"warn":""}"><div class="num">${low.length}</div><span>Need reordering</span></div><div class="st ${ex.length?"bad":""}"><div class="num">${ex.length}</div><span>Expired or expiring in 90 days</span></div></div>
 <div class="g3"><section class="card"><h2>Stock by category<small>Value of stock on the shelf</small></h2>${cats.slice(0,7).map(c=>`<div class="bar"><div class="bl"><span>${esc(c.name)}</span><small>${c.n} items · Br ${big(c.v)}</small></div><div class="bt"><div class="bf" style="width:${Math.max(3,c.v/max*100)}%"></div></div></div>`).join("")||'<p class="hint">No products yet.</p>'}</section>
 <section class="card"><h2>Fast movers<small>Units taken off the shelf, last 30 days</small></h2>${mv.slice(0,6).map(m=>`<div class="bar"><div class="bl"><span>${esc(m.name)}</span><small>${m.out} units</small></div><div class="bt"><div class="bf" style="width:${Math.max(4,m.out/mx*100)}%"></div></div></div>`).join("")||`<p class="hint">${hintHist()}</p>`}</section>
 <section class="card"><h2>Needs attention<small>Out of stock, low or expiring</small></h2>${at.map(i=>{const s=status(i),d=daysLeft(i.expiry);return `<div class="al"><div><b>${esc(i.name)}</b><small>${d<0?"Expired "+(-d)+" days ago":i.qty===0?"None left":i.qty+" left · reorder at "+i.reorder}</small></div><span class="pill ${s.k}">${s.t}</span></div>`}).join("")||'<p class="hint">Everything looks healthy.</p>'}<a class="lnk" href="#reorder">Open reorder list</a></section></div>
 <div class="g2"><section class="card"><h2>Stock movement<small>Units taken off the shelf per day, last 30 days. Corrections count too, so treat it as a guide.</small></h2>${chart()}</section>
 <section class="card"><h2>Backup</h2><p class="hint">${ago===null?"You have not exported a backup from this device yet.":"Last CSV backup from this device: "+(ago===0?"today":ago+" day"+(ago===1?"":"s")+" ago")+"."}</p><p class="hint">Keep a monthly copy of your stock list somewhere safe.</p><button class="btn" data-a="bk">Export CSV now</button></section></div>`}
function chart(){const v=daily(30);if(!v.some(x=>x>0))return `<p class="hint">${hintHist()}</p>`;
 const W=560,Hh=190,l=34,r=8,t=10,b=22,mx=Math.max(5,Math.ceil(Math.max(...v)/5)*5),X=i=>l+i*(W-l-r)/(v.length-1),Y=y=>t+(Hh-t-b)*(1-y/mx);
 const pts=v.map((y,i)=>[X(i),Y(y)]),line="M"+pts.map(p=>p[0].toFixed(1)+" "+p[1].toFixed(1)).join("L"),lab=i=>new Date(now-(29-i)*day).toLocaleDateString("en-GB",{day:"numeric",month:"short"});
 return `<svg class="chart" viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Units taken off the shelf per day"><defs><linearGradient id="gr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--brand);stop-opacity:.35"/><stop offset="1" style="stop-color:var(--brand);stop-opacity:0"/></linearGradient></defs>
 ${[0,.5,1].map(f=>`<line class="gl" x1="${l}" x2="${W-r}" y1="${Y(mx*f)}" y2="${Y(mx*f)}"/><text x="${l-6}" y="${Y(mx*f)+3}" text-anchor="end">${Math.round(mx*f)}</text>`).join("")}
 <path class="ar" d="${line}L${X(v.length-1)} ${Y(0)}L${l} ${Y(0)}Z"/><path class="ln" d="${line}"/>${pts.map((p,i)=>v[i]?`<circle cx="${p[0]}" cy="${p[1]}" r="3"><title>${lab(i)}: ${v[i]} units</title></circle>`:"").join("")}
 ${[0,14,29].map(i=>`<text x="${X(i)}" y="${Hh-6}" text-anchor="${i?i>20?"end":"middle":"start"}">${lab(i)}</text>`).join("")}</svg>`}

/* ---------- products ---------- */
const stf=i=>({all:()=>true,low:()=>i.qty<=i.reorder&&daysLeft(i.expiry)>=0,out:()=>i.qty===0,exp:()=>daysLeft(i.expiry)<=90,expired:()=>daysLeft(i.expiry)<0}[pf.st]||(()=>true))();
function filt(){const s=pf.q.toLowerCase();
 const S={name:(x,y)=>x.name.localeCompare(y.name),qty:(x,y)=>x.qty-y.qty,qtyd:(x,y)=>y.qty-x.qty,exp:(x,y)=>new Date(x.expiry)-new Date(y.expiry),price:(x,y)=>y.price-x.price};
 return items.filter(i=>(pf.cat==="All"||i.category===pf.cat)&&(!s||[i.name,i.generic,i.category,i.shelf].some(x=>String(x||"").toLowerCase().includes(s)))&&stf(i)).sort(S[pf.sort]||S.name)}
function pager(p,n){const s=[...new Set([1,n,p-1,p,p+1])].filter(x=>x>=1&&x<=n).sort((a,b)=>a-b),o=[];s.forEach((x,k)=>{if(k&&x-s[k-1]>1)o.push("…");o.push(x)});
 return `<button data-a="page" data-n="${p-1}" ${p<=1?"disabled":""}>Prev</button>`+o.map(x=>x==="…"?"<span>…</span>":`<button data-a="page" data-n="${x}" ${x===p?'aria-current="true"':""}>${x}</button>`).join("")+`<button data-a="page" data-n="${p+1}" ${p>=n?"disabled":""}>Next</button>`}
function vProducts(){
 const list=filt(),pages=Math.max(1,Math.ceil(list.length/pf.size));pf.page=Math.min(pf.page,pages);
 const from=(pf.page-1)*pf.size,rows=list.slice(from,from+pf.size),cats=["All",...new Set(items.map(i=>i.category).filter(Boolean))].sort((a,b)=>a==="All"?-1:b==="All"?1:a.localeCompare(b));
 const opt=(v,t,cur)=>`<option value="${v}" ${v===cur?"selected":""}>${t}</option>`;
 const allOn=rows.length&&rows.every(i=>pf.sel.has(i.id));
 return `<div class="ph"><div><h1>Products</h1><p class="sub">${items.length} products in stock list</p></div><button class="btn" data-a="add">${ic("plus")} Add product</button></div>
 <div class="tb"><select class="fs" data-f="cat" aria-label="Category">${cats.map(c=>opt(c,esc(c),pf.cat)).join("")}</select>
 <select class="fs" data-f="st" aria-label="Status">${[["all","All statuses"],["low","Needs reorder"],["out","Out of stock"],["exp","Expiring or expired"],["expired","Expired"]].map(([v,t])=>opt(v,t,pf.st)).join("")}</select>
 <select class="fs" data-f="sort" aria-label="Sort by">${[["name","Sort: Name"],["qty","Sort: Lowest quantity"],["qtyd","Sort: Highest quantity"],["exp","Sort: Soonest expiry"],["price","Sort: Highest price"]].map(([v,t])=>opt(v,t,pf.sort)).join("")}</select>
 <button class="btn ghost" data-a="csvall">Export CSV</button></div>
 ${pf.sel.size?`<div class="bulk"><span>${pf.sel.size} selected</span><button class="btn ghost sm" data-a="bexp">Export selected</button><button class="btn danger sm" data-a="bdel">Delete selected</button><button class="btn ghost sm" data-a="clear">Clear</button></div>`:""}
 <div class="tablebox"><table><thead><tr><th><input type="checkbox" data-all ${allOn?"checked":""} aria-label="Select all on this page"></th><th>Product</th><th>Category</th><th>Shelf</th><th>Quantity</th><th>Price</th><th>Expiry</th><th>Status</th><th></th></tr></thead><tbody>
 ${rows.map(i=>{const s=status(i);return `<tr><td><input type="checkbox" data-sel="${i.id}" ${pf.sel.has(i.id)?"checked":""} aria-label="Select ${esc(i.name)}"></td>
 <td><div class="pn"><span class="av" style="--h:${hue(i.category)}">${esc(String(i.name).slice(0,2))}</span><div><b>${esc(i.name)}</b> ${i.rx?'<span class="pill rx">Rx</span>':""}<small>${esc(i.strength)} · ${esc(i.form)}</small></div></div></td>
 <td>${esc(i.category)}</td><td>${esc(i.shelf)}</td><td><span class="qty"><button data-a="qty" data-id="${i.id}" data-d="-1" aria-label="Remove one ${esc(i.name)}">−</button><b>${i.qty}</b><button data-a="qty" data-id="${i.id}" data-d="1" aria-label="Add one ${esc(i.name)}">+</button></span><small>Reorder at ${i.reorder}</small></td>
 <td>${money(i.price)}</td><td>${esc(i.expiry)}</td><td><span class="pill ${s.k}">${s.t}</span></td>
 <td class="act"><button class="icb sm" data-a="edit" data-id="${i.id}" aria-label="Edit ${esc(i.name)}">${ic("edit")}</button><button class="icb sm dg" data-a="del" data-id="${i.id}" aria-label="Delete ${esc(i.name)}">${ic("trash")}</button></td></tr>`}).join("")}</tbody></table>
 ${rows.length?"":'<div class="empty">No products match these filters.</div>'}</div>
 <div class="ft"><span>Showing ${list.length?from+1:0}–${Math.min(from+pf.size,list.length)} of ${list.length}</span><div class="pg">${pager(pf.page,pages)}</div>
 <label style="display:flex;align-items:center;gap:8px;color:var(--mute)">Show<select class="fs" data-f="size" aria-label="Rows per page">${[10,25,50].map(n=>opt(String(n),n,String(pf.size))).join("")}</select></label></div>`}
async function bump(id,d){const i=items.find(x=>x.id===id),old=i.qty,n=Math.max(0,old+d);if(n===old)return;i.qty=n;renderMain();
 try{{const r=await api("/rest/v1/rpc/adjust_qty",{method:"POST",body:{p_id:id,p_delta:n-old}});if(typeof r==="number"&&r!==n){i.qty=r;renderMain()}}histOk=false}catch(x){i.qty=old;renderMain();toast("Couldn’t save: "+x.message)}}
async function delOne(id){const i=items.find(x=>x.id===id);if(!confirm("Delete "+i.name+"? This cannot be undone."))return;
 try{await api(`/rest/v1/items?id=eq.${id}`,{method:"DELETE"});items=items.filter(x=>x.id!==id);pf.sel.delete(id);histOk=false;renderMain();toast("Product deleted")}catch(x){toast(x.message)}}
async function delMany(){const ids=[...pf.sel];if(!ids.length||!confirm("Delete "+ids.length+" products? This cannot be undone."))return;
 try{await api(`/rest/v1/items?id=in.(${ids.join(",")})`,{method:"DELETE"});items=items.filter(x=>!pf.sel.has(x.id));pf.sel.clear();histOk=false;renderMain();toast(ids.length+" products deleted")}catch(x){toast(x.message)}}
function edit(id){const i=id?items.find(x=>x.id===id):{name:"",generic:"",category:"",strength:"",form:"Tablet",qty:0,reorder:20,price:0,expiry:new Date(now+365*day).toISOString().slice(0,10),rx:false,shelf:""};
 const f=$("#f"),inp=(k,l,t="text",full)=>`<label class="${full?"full":""}" style="${full?"grid-column:1/-1":""}">${l}<input name="${k}" type="${t}" value="${esc(i[k])}" ${t==="number"?'min="0" step="any"':""} required></label>`;
 f.innerHTML=`<h2>${id?"Edit product":"Add product"}</h2>${inp("name","Brand name","text",1)}${inp("generic","Generic name")}${inp("category","Category")}${inp("strength","Strength")}${inp("form","Form")}${inp("qty","Quantity","number")}${inp("reorder","Reorder at","number")}${inp("price","Price (Br)","number")}${inp("expiry","Expiry date","date")}${inp("shelf","Shelf")}
 <label class="chk" style="grid-column:1/-1;display:flex"><input type="checkbox" name="rx" ${i.rx?"checked":""}> Prescription required</label>
 <div class="acts"><button type="button" class="btn ghost" id="cx">Cancel</button><button class="btn" id="sv">Save product</button></div>`;
 $("#dlg").showModal();$("#cx").onclick=()=>$("#dlg").close();
 f.onsubmit=async e=>{e.preventDefault();const d=new FormData(f),o={};
  ["name","generic","category","strength","form","shelf","expiry"].forEach(k=>o[k]=String(d.get(k)).trim());["qty","reorder","price"].forEach(k=>o[k]=+d.get(k));o.rx=d.has("rx");o.updated_at=new Date().toISOString();
  const sv=$("#sv");sv.disabled=true;sv.textContent="Saving…";
  try{if(id){const r=await api(`/rest/v1/items?id=eq.${id}`,{method:"PATCH",body:o,prefer:"return=representation"});items[items.findIndex(x=>x.id===id)]=r[0]}
   else{const r=await api("/rest/v1/items",{method:"POST",body:o,prefer:"return=representation"});items.push(r[0])}
   histOk=false;$("#dlg").close();renderMain();toast(id?"Changes saved":"Product added")}
  catch(x){sv.disabled=false;sv.textContent="Save product";toast("Couldn’t save: "+x.message)}}}

/* ---------- reorder list ---------- */
function orderText(rows){const d=new Date().toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"});return PHARMACY.name+" - order list, "+d+"\n\n"+rows.map((i,k)=>`${k+1}. ${i.name} ${i.strength} (${i.form}) - ${plan[i.id].n}`).join("\n")+"\n\nThank you."}
function vReorder(){const low=lowItems(),ex=expItems();low.forEach(i=>{if(!plan[i.id])plan[i.id]={on:true,n:Math.max(i.reorder*2-i.qty,1)}});
 return `<div class="ph"><div><h1>Reorder list</h1><p class="sub">At or below the reorder level, most urgent first. Suggested amounts bring each item back to twice its reorder level.</p></div></div>
 ${low.length?`<div class="tb"><button class="btn" data-a="rcp">Copy as text</button><button class="btn ghost" data-a="rwa">Share on WhatsApp</button><button class="btn ghost" onclick="window.print()">Print</button><button class="btn ghost" data-a="rcsv">Download CSV</button></div>
 <div class="tablebox"><table style="min-width:640px"><thead><tr><th>Order</th><th>Product</th><th>In stock</th><th>Reorder level</th><th>Amount to order</th><th>Status</th></tr></thead><tbody>${low.map(i=>{const p=plan[i.id],s=status(i);return `<tr><td><input type="checkbox" data-on="${i.id}" ${p.on?"checked":""} aria-label="Include ${esc(i.name)}"></td><td><b>${esc(i.name)}</b><small>${esc(i.strength)} · ${esc(i.form)}</small></td><td>${i.qty}</td><td>${i.reorder}</td><td><input class="ord" type="number" min="1" data-n="${i.id}" value="${p.n}" aria-label="Amount for ${esc(i.name)}"></td><td><span class="pill ${s.k}">${s.t}</span></td></tr>`}).join("")}</tbody></table></div>`:'<div class="card empty"><b>Nothing to reorder.</b><br>Every medicine is above its reorder level.</div>'}
 ${ex.length?`<h2 style="margin:28px 0 12px">Expired or expiring within 90 days</h2><div class="tablebox"><table style="min-width:560px"><thead><tr><th>Product</th><th>In stock</th><th>Expiry</th><th>Status</th></tr></thead><tbody>${ex.map(i=>{const d=daysLeft(i.expiry);return `<tr><td><b>${esc(i.name)}</b></td><td>${i.qty}</td><td>${esc(i.expiry)}</td><td><span class="pill ${d<0?"bad":"low"}">${d<0?"Expired "+(-d)+"d ago":"In "+d+" days"}</span></td></tr>`}).join("")}</tbody></table></div>`:""}`}
function reorderAct(a){const rows=lowItems().filter(i=>plan[i.id]&&plan[i.id].on);if(!rows.length)return toast("Tick at least one item");
 if(a==="rcp")navigator.clipboard.writeText(orderText(rows)).then(()=>toast("List copied"),()=>window.prompt("Copy this list:",orderText(rows)));
 if(a==="rwa")window.open("https://wa.me/?text="+encodeURIComponent(orderText(rows)),"_blank");
 if(a==="rcsv")csv("reorder-list",[["product","strength","form","in stock","amount to order"]].concat(rows.map(i=>[i.name,i.strength,i.form,i.qty,plan[i.id].n])))}

/* ---------- history ---------- */
function what(h){if(h.action==="added")return "Added with "+h.new_qty+" in stock";if(h.action==="deleted")return "Deleted (had "+h.old_qty+" in stock)";let o="";
 if(h.old_qty!==h.new_qty){const d=h.new_qty-h.old_qty;o+=`<span class="pill ${d>0?"ok":"low"}">${d>0?"+":"-"}${Math.abs(d)}</span> ${h.old_qty} to ${h.new_qty}. `}return o+esc(h.details||"")}
function vHistory(){let body;
 if(histErr==="setup")body='<div class="card empty"><b>History isn’t set up yet.</b><br>Run the history script in Supabase once, then reload.</div>';
 else if(histErr)body=`<div class="card empty"><b>Couldn’t load history.</b><br>${esc(histErr)}</div>`;
 else{const s=pf.q.toLowerCase(),rows=hist.filter(h=>!s||[h.item_name,h.changed_by,h.details].some(x=>String(x||"").toLowerCase().includes(s)));
  body=`<div class="tablebox"><table style="min-width:620px"><thead><tr><th>When</th><th>Who</th><th>Medicine</th><th>What changed</th></tr></thead><tbody>${rows.slice(0,200).map(h=>`<tr><td>${when(h.changed_at)}</td><td>${esc(h.changed_by)}</td><td><b>${esc(h.item_name)}</b></td><td>${what(h)}</td></tr>`).join("")}</tbody></table>${rows.length?"":'<div class="empty">No changes recorded yet.</div>'}</div><p class="hint" style="margin-top:12px">Showing up to 200 of the latest 1,000 changes.</p>`}
 return `<div class="ph"><div><h1>History</h1><p class="sub">Every stock change, who made it and when. Recorded automatically by the database.</p></div><button class="btn ghost" data-a="rl">Refresh</button></div>${body}`}

/* ---------- reports ---------- */
function reportData(){
 const cats=catStats(),exp=items.filter(i=>daysLeft(i.expiry)<=180).sort((a,b)=>new Date(a.expiry)-new Date(b.expiry)),mv=movers(30);
 const fast=mv.map(m=>{const it=items.find(i=>i.name===m.name),left=it?it.qty:"";return{name:m.name,out:m.out,qty:left,days:it&&m.out?Math.round(it.qty/(m.out/30)):""}});
 return{cats,exp,fast}}
function vReports(){const {cats,exp,fast}=reportData();
 const tb=(h,r)=>`<div class="tablebox"><table><thead><tr>${h.map(x=>`<th>${x}</th>`).join("")}</tr></thead><tbody>${r.map(x=>`<tr>${x.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
 return `<div class="ph"><div><h1>Reports</h1><p class="sub">Tables you can download for your records or your accountant.</p></div><button class="btn" data-a="csvall">Full stock list (CSV)</button></div>
 <div class="rg"><section class="card"><h2>Stock value by category</h2>${cats.length?tb(["Category","Items","Units","Value (Br)"],cats.slice(0,12).map(c=>[esc(c.name),c.n,big(c.units),big(c.v)])):'<p class="hint">No products yet.</p>'}<p><button class="btn ghost sm" data-a="rep" data-n="val">Download CSV</button></p></section>
 <section class="card"><h2>Expiry report<small>Expired or expiring within 180 days</small></h2>${exp.length?tb(["Product","Qty","Expiry","Value at risk"],exp.slice(0,12).map(i=>[esc(i.name),i.qty,esc(i.expiry),money(i.qty*i.price)])):'<p class="hint">Nothing expiring soon.</p>'}<p><button class="btn ghost sm" data-a="rep" data-n="exp">Download CSV</button></p></section>
 <section class="card"><h2>Fast movers<small>Last 30 days, with estimated days of stock left</small></h2>${fast.length?tb(["Product","Units out","In stock","Days left"],fast.slice(0,12).map(m=>[esc(m.name),m.out,m.qty,m.days])):`<p class="hint">${hintHist()}</p>`}<p><button class="btn ghost sm" data-a="rep" data-n="mov">Download CSV</button></p></section>
 <section class="card"><h2>About these numbers</h2><p class="hint">Movement comes from the History log: whenever a quantity goes down, the difference counts as units taken off the shelf. Corrections and write-offs count too, so this is a guide to demand, not an exact sales figure. A proper sales log can be added later.</p></section></div>`}
function reportCSV(k){const {cats,exp,fast}=reportData();
 if(k==="val")csv("stock-value-by-category",[["category","items","units","value"]].concat(cats.map(c=>[c.name,c.n,c.units,c.v.toFixed(2)])));
 if(k==="exp")csv("expiry-report",[["product","qty","expiry","days left","value at risk"]].concat(exp.map(i=>[i.name,i.qty,i.expiry,daysLeft(i.expiry),(i.qty*i.price).toFixed(2)])));
 if(k==="mov")csv("fast-movers-30-days",[["product","units out","in stock","days of stock left"]].concat(fast.map(m=>[m.name,m.out,m.qty,m.days])))}

function vStaff(){const mine=uid(),dt=t=>new Date(t).toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"});
 return `<div class="ph"><div><h1>Staff access</h1><p class="sub">Invite people, choose who can use the stock room, and who is a manager.</p></div></div>
 <form class="card" id="inv" style="max-width:700px;margin-bottom:16px"><h2>Invite a new person<small>They get an email to set their own password.</small></h2><div class="fgrid"><label class="full">Email<input name="email" type="email" required autocomplete="off"></label><label>Role<select name="role" class="fs"><option value="staff">Staff</option><option value="manager">Manager</option></select></label></div><p><button class="btn" id="ib">Send invitation</button></p></form>
 <div class="tablebox"><table style="min-width:820px"><thead><tr><th>Email</th><th>Role</th><th>Access</th><th>Status</th><th>Added</th><th></th></tr></thead><tbody>${people.map(p=>{const you=p.user_id===mine,pend=!p.accepted_at;return `<tr><td><b>${esc(p.email)}</b>${you?' <span class="pill rx">You</span>':""}</td>
 <td><select class="fs" data-role="${p.user_id}" ${you?"disabled":""} aria-label="Role for ${esc(p.email)}"><option value="staff" ${p.role==="staff"?"selected":""}>Staff</option><option value="manager" ${p.role==="manager"?"selected":""}>Manager</option></select></td>
 <td><label class="chk" style="display:flex"><input type="checkbox" data-act="${p.user_id}" ${p.active?"checked":""} ${you?"disabled":""}> ${p.active?"Active":"Switched off"}</label></td>
 <td><span class="pill ${pend?"low":"ok"}">${pend?"Invite pending":"Joined"}</span></td><td>${dt(p.created_at)}</td>
 <td class="act">${you?"":`${pend?`<button class="btn ghost sm" data-a="resend" data-id="${p.user_id}" data-email="${esc(p.email)}">Resend</button> `:""}<button class="btn danger sm" data-a="remove" data-id="${p.user_id}" data-email="${esc(p.email)}">Remove</button>`}</td></tr>`}).join("")}</tbody></table>${people.length?"":'<div class="empty">No people found.</div>'}</div>
 <div class="card" style="margin-top:16px"><h2>Access changes<small>Latest 15, recorded automatically</small></h2>${alog.length?alog.map(l=>`<div class="al"><div><b>${esc(l.target_email)}</b><small>${esc(l.change)} · by ${esc(l.actor_email)}</small></div><small>${when(l.at)}</small></div>`).join(""):'<p class="hint">Nothing recorded yet.</p>'}</div>
 <div class="card" style="margin-top:16px"><h2>What each role can do</h2><p class="hint">Staff can view, add and edit products, adjust quantities and see the history. Only managers can delete products and change who has access. You cannot switch off, demote or remove yourself, and the system keeps at least one active manager.</p></div>`}
async function invite(e){e.preventDefault();const d=new FormData(e.target),b=$("#ib");b.disabled=true;b.textContent="Sending…";
 try{await api("/functions/v1/invite-staff",{method:"POST",body:{action:"invite",email:String(d.get("email")).trim(),role:d.get("role"),redirect:STAFF_URL}});toast("Invitation sent");await loadPeople()}catch(x){toast(x.message)}renderMain()}
async function userAct(a,id,email){if(a==="remove"&&!confirm("Remove "+email+" completely? They will lose all access."))return;
 try{await api("/functions/v1/invite-staff",{method:"POST",body:{action:a,email,user_id:id,redirect:STAFF_URL}});toast(a==="resend"?"Invitation resent":"Person removed");await loadPeople()}catch(x){toast(x.message)}renderMain()}
async function setPerson(id,patch){try{const r=await api(`/rest/v1/profiles?user_id=eq.${id}`,{method:"PATCH",body:patch,prefer:"return=representation"});if(r[0])people[people.findIndex(p=>p.user_id===id)]=r[0];toast("Saved")}catch(e){toast(e.message)}renderMain()}

/* ---------- settings ---------- */
function vSettings(){const c=cfg;
 return `<div class="ph"><div><h1>Settings</h1><p class="sub">These details appear on the customer page and the QR poster.</p></div></div>
 ${c?`<form class="card" id="sf" style="max-width:700px"><div class="fgrid"><label class="full">Pharmacy name<input name="name" value="${esc(c.name)}" required></label><label class="full">Area or address<input name="area" value="${esc(c.area)}"></label>
 <label>Phone number<input name="phone" value="${esc(c.phone)}" placeholder="+251 91 234 5678" inputmode="tel"></label><label>Opening hours<input name="hours" value="${esc(c.hours)}" placeholder="Open daily 8:00 to 21:00"></label></div><p><button class="btn" id="ssv">Save details</button></p></form>`:'<div class="card empty"><b>Settings aren’t set up yet.</b><br>Run manager_setup.sql in Supabase, then reload.</div>'}`}

/* ---------- events ---------- */
function onClick(e){const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a,id=b.dataset.id;
 if(a==="qty")return bump(id,+b.dataset.d);if(a==="edit")return edit(id);if(a==="add")return edit();if(a==="del")return delOne(id);
 if(a==="page"){pf.page=+b.dataset.n;return renderMain()}if(a==="clear"){pf.sel.clear();return renderMain()}
 if(a==="bdel")return delMany();if(a==="bexp")return csv("selected-stock",itemRows(items.filter(i=>pf.sel.has(i.id))));
 if(a==="csvall"||a==="bk")return exportItems();if(a==="rep")return reportCSV(b.dataset.n);
 if(a==="rl"){histOk=false;return loadFor(route)}if(a==="resend"||a==="remove")return userAct(a,id,b.dataset.email);if(["rcp","rwa","rcsv"].includes(a))return reorderAct(a)}
function onChange(e){const t=e.target;
 if(t.dataset.f){pf[t.dataset.f]=t.dataset.f==="size"?+t.value:t.value;pf.page=1;return renderMain()}
 if(t.dataset.all!==undefined){const rows=filt().slice((pf.page-1)*pf.size,pf.page*pf.size);rows.forEach(i=>t.checked?pf.sel.add(i.id):pf.sel.delete(i.id));return renderMain()}
 if(t.dataset.sel){t.checked?pf.sel.add(t.dataset.sel):pf.sel.delete(t.dataset.sel);return renderMain()}
 if(t.dataset.on)plan[t.dataset.on].on=t.checked;
 if(t.dataset.n){plan[t.dataset.n].n=Math.max(1,parseInt(t.value)||1);t.value=plan[t.dataset.n].n}
 if(t.dataset.role){if(t.value==="manager"&&!confirm("Make this person a manager? Managers can delete products and control everyone's access."))return renderMain();setPerson(t.dataset.role,{role:t.value})}
 if(t.dataset.act){if(!t.checked&&!confirm("Switch this person's access off?"))return renderMain();setPerson(t.dataset.act,{active:t.checked})}}
async function onSubmit(e){if(e.target.id==="inv")return invite(e);if(e.target.id!=="sf")return;e.preventDefault();const d=new FormData(e.target),o={updated_at:new Date().toISOString()};["name","area","phone","hours"].forEach(k=>o[k]=String(d.get(k)).trim());
 const b=$("#ssv");b.disabled=true;b.textContent="Saving…";
 try{const r=await api("/rest/v1/settings?id=eq.1",{method:"PATCH",body:o,prefer:"return=representation"});cfg=r[0]||Object.assign(cfg,o);PHARMACY.name=cfg.name;toast("Details saved. The customer page now shows them.")}catch(x){toast("Couldn’t save: "+x.message)}
 renderMain()}
start();
</script>
</body>
</html>
